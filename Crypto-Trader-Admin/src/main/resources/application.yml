server:
  port: 9000
spring:
  config:
    import: aws-secretsmanager:/cryptotrader/dev
  application:
    name: crypto-trader-admin
  output:
    ansi:
      enabled: ALWAYS
  main:
    banner-mode: console
  datasource:
    url: ${PSQL_DB_URL}
    username: ${PSQL_USER}
    password: ${PSQL_PW}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    aws:
      region:
        static: us-east-1
    stream:
      defaultBinder: kafka
      bindings:
        # Outbound (publisher example)
        exampleEvent-out-0:
          destination: ct.example.v1
          contentType: application/vnd.cryptotrader.encrypted+json

        # Inbound (subscriber example)
        exampleEvent-in-0:
          destination: ct.example.v1
          group: ${spring.application.name}
          contentType: application/vnd.cryptotrader.encrypted+json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        bindings:
          exampleEvent-in-0:
            consumer:
              enableDlq: true
              dlqName: ct.example.v1.DLT
logging:
  level:
    org:
      springframework: INFO
security:
  crypto:
    tink:
      keyset-name: ${SECURITY_TINK_KEYSET_NAME:default-aead}
      generate-if-missing: ${SECURITY_TINK_GENERATE_IF_MISSING:true}
management:
  endpoints.web.exposure.include: health,info
