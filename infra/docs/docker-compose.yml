name: crypto-trader-docs

services:
  docs:
    build:
      context: ../../
      dockerfile: Crypto-Trader-Docs/Dockerfile
      target: preview
    ports:
      - "127.0.0.1:8001:8000"
    develop:
      watch:
        - action: sync
          path: ../../Crypto-Trader-Docs/docs
          target: /docs/docs
        - action: sync
          path: ../../Crypto-Trader-Docs/mkdocs.yml
          target: /docs/mkdocs.yml

  kotlin-cli:
    profiles: [build]
    build:
      context: ../../
      dockerfile: Crypto-Trader-Docs/Dockerfile
      target: builder
    init: true
    depends_on:
      - kafka
    environment:
      MAVEN_OPTS: ${DOCS_MAVEN_OPTS:--Xms512m -Xmx4g -XX:+UseG1GC}
      DOCS_KOTLIN_INCREMENTAL: ${DOCS_KOTLIN_INCREMENTAL:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ../../:/app
      - maven-cache:/root/.m2
      - node-modules:/app/Crypto-Trader-Website/node_modules
      - npm-cache:/root/.npm

  kafka:
    profiles: [build]
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  maven-cache:
  node-modules:
  npm-cache:
