<!-- auth-console-signup-section.component.html -->
<ng-container>
    <auth-input
        [authInputType]="AuthInputType.Email"
        (inputChange)="updateEmail($event)"
        [errorMessage]="emailErrorMessage"
    />
    <auth-input
        [authInputType]="AuthInputType.Password"
        (inputChange)="updatePassword($event)"
        [errorMessage]="passwordErrorMessage"
    />
    <auth-input
        [authInputType]="AuthInputType.ConfirmPassword"
        (inputChange)="updateConfirmPassword($event)"
        [errorMessage]="confirmPasswordErrorMessage"
    />
    <auth-input
        [authInputType]="AuthInputType.AgreeTerms"
        (inputChange)="updateAgreedTerms($event)"
        [errorMessage]="agreedTermsErrorMessage"
    />
    <ss-button
        [size]="ElementSize.MEDIUM"
        [text]="ButtonText.SIGN_UP"
        (buttonClick)="emitFields()"
    />
</ng-container>
