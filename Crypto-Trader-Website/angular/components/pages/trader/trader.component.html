<!-- trader.component.html -->
<ng-container>
    <page-title-stripe [titleStripe]="traderPageTitleStripe"/>
    <!--    TODO: Put this on the left. If thin, then on top.-->
    <trader-event-filter-bar />
    @if (hasTradeEvents !== undefined && !hasTradeEvents) {
        <ss-paragraph [text]="'No trades found.'" />
    } @else {
        @if (getTradeEvents()) {
            <div
                [@listStagger]="getTradeEvents().length"
                class="trade-event-bubbles"
            >
                @for (tradeEvent of getTradeEvents(); track tradeEvent.id) {
                    <trader-event-bubble [tradeEvent]="tradeEvent" />
                }
            </div>
        }
        <loading-wheel [visible]="isFetching" />
    }
</ng-container>
