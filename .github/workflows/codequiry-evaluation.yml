name: Codequiry PR evaluation

on:
  # TEMPORARY PR #181 rehearsal. Remove this push trigger before merging.
  # Only workflow edits on this exact branch can start a paid test.
  push:
    branches:
      - 134-as-a-maintainer-i-want-to-block-prs-whose-estimated-ai-code-score-exceeds-a-configurable-limit
    paths:
      - '.github/workflows/codequiry-evaluation.yml'
  # Runs trusted base-branch tooling; never check out or execute the PR head.
  pull_request_target:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Crypto-Trader PR number to evaluate
        required: true
        type: number
      authorize_upload_and_charges:
        description: I authorize uploading this PR's additions and Codequiry charges
        required: true
        default: false
        type: boolean
      delete_after:
        description: Request deletion after successful analysis (requires provider entitlement)
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: codequiry-evaluation-${{ github.event.pull_request.number || inputs.pr_number || (github.event_name == 'push' && 181) }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.repository_id == '642387518' &&
      ((github.event_name == 'push' && !github.event.deleted &&
        github.ref == 'refs/heads/134-as-a-maintainer-i-want-to-block-prs-whose-estimated-ai-code-score-exceeds-a-configurable-limit') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development' && inputs.authorize_upload_and_charges) ||
       (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.owner.id == 279793999 &&
        (github.event.action != 'edited' || github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: codequiry-analysis
    steps:
      - name: Prevent accidental paid reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "Reruns are blocked to prevent duplicate Codequiry charges."
            echo "If the prior attempt failed configuration validation before creating a receipt, no provider reconciliation is needed."
            echo "Fix the configuration and push a workflow change to start a fresh run."
            echo "If analysis had started, inspect the prior receipt and Codequiry job before starting another run."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Base commit for PR events; reviewed feature commit for the temporary push test.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Check required configuration before provider access
        env:
          CODEQUIRY_API_KEY: ${{ secrets.CODEQUIRY_API_KEY }}
          CODEQUIRY_ENGINE_ID: ${{ vars.CODEQUIRY_ENGINE_ID }}
          AI_DETECTION_MAX_SCORE: ${{ vars.AI_DETECTION_MAX_SCORE }}
          AI_DETECTION_MIN_LINES: ${{ vars.AI_DETECTION_MIN_LINES }}
        run: |
          missing=0
          for name in CODEQUIRY_API_KEY CODEQUIRY_ENGINE_ID AI_DETECTION_MAX_SCORE AI_DETECTION_MIN_LINES; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Configure CODEQUIRY_API_KEY as a secret and the other settings as Actions variables."
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "Codequiry has not been contacted. Fix the settings and start a fresh run."
            exit 1
          fi
      - name: Evaluate the requested PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEQUIRY_API_KEY: ${{ secrets.CODEQUIRY_API_KEY }}
          CODEQUIRY_ENGINE_ID: ${{ vars.CODEQUIRY_ENGINE_ID }}
          AI_DETECTION_MAX_SCORE: ${{ vars.AI_DETECTION_MAX_SCORE }}
          AI_DETECTION_MIN_LINES: ${{ vars.AI_DETECTION_MIN_LINES }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || (github.event_name == 'push' && 181) }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          DELETE_AFTER: ${{ inputs.delete_after }}
        run: |
          mkdir -p "$RUNNER_TEMP/codequiry"
          options=()
          if [ "$DELETE_AFTER" = "true" ]; then
            options+=(--delete-after)
          fi
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            options+=(--expected-head-sha "$EXPECTED_HEAD_SHA")
          fi
          python -m scripts.ai_detection.codequiry_run "$PR_NUMBER" --engine-id "$CODEQUIRY_ENGINE_ID" --receipt "$RUNNER_TEMP/codequiry/receipt.json" --report "$RUNNER_TEMP/codequiry/report.json" --summary "$GITHUB_STEP_SUMMARY" --authorize-upload-and-charges "${options[@]}"
      - name: Publish the result on the PR commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m scripts.ai_detection.github_check "$RUNNER_TEMP/codequiry/report.json" --head-sha "$EXPECTED_HEAD_SHA" --details-url "$RUN_URL"
      - name: Preserve the provider receipt for reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codequiry-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codequiry/receipt.json
            ${{ runner.temp }}/codequiry/report.json
          if-no-files-found: ignore
          retention-days: 7
