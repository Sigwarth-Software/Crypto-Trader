name: Codequiry PR evaluation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Crypto-Trader PR number to evaluate
        required: true
        type: number
      authorize_upload_and_charges:
        description: I authorize uploading this PR's additions and Codequiry charges
        required: true
        default: false
        type: boolean
      delete_after:
        description: Request deletion after successful analysis (requires provider entitlement)
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codequiry-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/development' && inputs.authorize_upload_and_charges
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: codequiry-analysis
    steps:
      - name: Prevent accidental paid reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "Reconcile the prior provider check before authorizing a new workflow run."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Evaluate the requested PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEQUIRY_API_KEY: ${{ secrets.CODEQUIRY_API_KEY }}
          CODEQUIRY_ENGINE_ID: ${{ vars.CODEQUIRY_ENGINE_ID }}
          AI_DETECTION_MAX_SCORE: ${{ vars.AI_DETECTION_MAX_SCORE }}
          AI_DETECTION_MIN_LINES: ${{ vars.AI_DETECTION_MIN_LINES }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DELETE_AFTER: ${{ inputs.delete_after }}
        run: |
          mkdir -p "$RUNNER_TEMP/codequiry"
          options=()
          if [ "$DELETE_AFTER" = "true" ]; then
            options+=(--delete-after)
          fi
          python -m scripts.ai_detection.codequiry_run "$PR_NUMBER" --engine-id "$CODEQUIRY_ENGINE_ID" --receipt "$RUNNER_TEMP/codequiry/receipt.json" --summary "$GITHUB_STEP_SUMMARY" --authorize-upload-and-charges "${options[@]}"
      - name: Preserve the provider receipt for reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codequiry-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/codequiry/receipt.json
          if-no-files-found: ignore
          retention-days: 7
