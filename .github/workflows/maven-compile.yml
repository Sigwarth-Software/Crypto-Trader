name: Maven Compile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ct-maven-compile
  cancel-in-progress: false

jobs:
  compile-on-aws:
    name: Compile Maven Reactor
    # Forks must not receive the AWS role or private package credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::698784776814:role/ct-maven-compile-github-actions
          aws-region: us-east-1

      - name: Compile on CodeBuild and wait
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: ct-maven-compile
          buildspec-override: .aws/buildspec-maven-compile.yml
          source-version-override: ${{ github.sha }}
