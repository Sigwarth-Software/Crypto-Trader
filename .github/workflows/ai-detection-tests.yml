name: AI detection tooling tests

on:
  pull_request:
    branches: [development]
    paths:
      - 'scripts/ai_detection/**'
      - '.github/workflows/ai-detection-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/ai_detection/tests -v
