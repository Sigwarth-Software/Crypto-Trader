spring:
  application:
    name: crypto-trader-chat
  config:
    import: aws-secretsmanager:/cryptotrader${CT_SECRETS_SUFFIX:}/dev
  cloud:
    aws:
      region:
        static: us-east-1
    function:
      definition: initConversationConsumer
    stream:
      enabled: true
      defaultBinder: kafka
      bindings:
        applicationLogs-out-0:
          destination: ct.logging.application.v1
          contentType: application/vnd.cryptotrader.encrypted+json
        applicationExceptions-out-0:
          destination: ct.logging.exception.v1
          contentType: application/vnd.cryptotrader.encrypted+json
        initConversationConsumer-in-0:
          destination: ct.chat.init.requests.v1
          group: crypto-trader-chat-group
          contentType: application/vnd.cryptotrader.encrypted+json
        initConversationResponses-out-0:
          destination: ct.chat.init.responses.v1
          contentType: application/vnd.cryptotrader.encrypted+json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  ai:
    openai:
      api-key: ${OPENAI_KEY}
    mcp:
      client:
        enabled: true
        type: SYNC
        initialized: true
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            crypto-trader-agent:
              url: http://127.0.0.1:8089
              endpoint: /mcp
  datasource:
      url: ${PSQL_DB_URL}
      username: ${PSQL_USER}
      password: ${PSQL_PW}
      generate-unique-name: false
      driver-class-name: org.postgresql.Driver
  jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      show-sql: false
      hibernate:
          ddl-auto: update
          naming:
              implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
              physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server:
  port: 8090

logging:
  level:
    org.springframework.ai: DEBUG
chat:
  model:
    default: gpt-5.4

