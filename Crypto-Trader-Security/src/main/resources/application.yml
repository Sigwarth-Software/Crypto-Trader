server:
  port: 8095
spring:
  application:
    name: crypto-trader-security
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  config:
    import: aws-secretsmanager:/cryptotrader/dev
  cloud:
    aws:
      region:
        static: us-east-1
    stream:
      enabled: true
      defaultBinder: kafka
      bindings:
        applicationLogs-out-0:
          destination: ct.logging.application.v1
          contentType: application/vnd.cryptotrader.encrypted+json
        applicationExceptions-out-0:
          destination: ct.logging.exception.v1
          contentType: application/vnd.cryptotrader.encrypted+json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

security:
  crypto:
    tink:
      keyset-name: ${SECURITY_TINK_KEYSET_NAME:default-aead}
      generate-if-missing: ${SECURITY_TINK_GENERATE_IF_MISSING:true}
