server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        return 302 /Crypto-Trader/;
    }

    location = /Crypto-Trader {
        return 302 /Crypto-Trader/;
    }

    location /Crypto-Trader/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
