server:
  port: 8094

spring:
  config:
    import: aws-secretsmanager:/cryptotrader/dev
  application:
    name: crypto-trader-health
  datasource:
    url: ${PSQL_DB_URL}
    username: ${PSQL_USER}
    password: ${PSQL_PW}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  cloud:
    aws:
      region:
        static: us-east-1
    stream:
      enabled: true
      defaultBinder: kafka
      bindings:
        applicationLogs-out-0:
          destination: ct.logging.application.v1
          contentType: application/vnd.cryptotrader.encrypted+json
        applicationExceptions-out-0:
          destination: ct.logging.exception.v1
          contentType: application/vnd.cryptotrader.encrypted+json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

ct:
  health:
    enabled: true
    interval-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health
