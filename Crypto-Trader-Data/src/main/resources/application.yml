server:
  port: 8085

spring:
  config:
    import: aws-secretsmanager:/cryptotrader/dev
  cloud:
    aws:
      region:
        static: us-east-1
    stream:
      enabled: true
      defaultBinder: kafka
      bindings:
        executionSpeedLogs-out-0:
          destination: ct.logging.execution-speed.v1
          contentType: application/vnd.cryptotrader.encrypted+json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.generate_statistics: false
      hibernate.jdbc.use_get_generated_keys: true
      hibernate.flushMode: COMMIT
      hibernate.jdbc.batch_size: 1000
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.order_inserts: true
      hibernate.batch_versioned_data: true
      hibernate.jdbc.use_scrollable_resultset: false
      hibernate.jdbc.use_streams_for_binary: false
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000
      connection-init-sql: "set synchronous_commit = off"
      leak-detection-threshold: 0  # set 0 to disable
      auto-commit: false
      idle-timeout: 30000
      max-lifetime: 1800000
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: crypto-trader-data
security:
  crypto:
    tink:
      keyset-name: ${SECURITY_TINK_KEYSET_NAME:default-aead}
      generate-if-missing: ${SECURITY_TINK_GENERATE_IF_MISSING:true}
management:
  endpoints.web.exposure.include: health,info
